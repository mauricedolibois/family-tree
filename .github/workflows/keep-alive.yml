name: Keep Supabase Alive
# Keeps the free Supabase cloud project awake and backs up every tree daily.
# Only needed while the app runs on Vercel with Supabase cloud; on an own server
# the daily backup runs via cron instead (see README, "Deployment").

on:
  schedule:
    # Every day at 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch: # Allows a manual run

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run keep-alive script
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/keep-alive.mjs

      - name: Daily backup of all trees
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/daily-backup.mjs

  # GitHub disables scheduled workflows in public repos after 60 days without a
  # commit (that happened in April 2026, and Supabase paused afterwards). This job
  # re-enables the workflow on every run via the API, which resets the 60 days.
  # It also runs when the Supabase job above fails.
  keep-workflow-enabled:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"

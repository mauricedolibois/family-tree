stages:
  - build-docker
  - deploy

variables:
  DOCKER_CONTEXT: "${CI_PROJECT_DIR}/app/"
  DOCKERFILE: "${CI_PROJECT_DIR}/app/Dockerfile"

docker_build:
  stage: build-docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${DOCKER_CONTEXT}"
      --dockerfile "${DOCKERFILE}"
      --destination "${CI_REGISTRY_IMAGE}/family-tree:latest"
      --build-arg "NODE_ENV=production"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: ubuntu:22.04
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apt-get -yq update
    - apt-get -yqq install ssh
    - install -m 600 -D /dev/null ~/.ssh/id_ed25519
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - ssh-keyscan -p $SSH_PORT -H $SSH_HOST > ~/.ssh/known_hosts
  script:
    - scp -i ~/.ssh/id_ed25519 -P $SSH_PORT docker-compose.yml $SSH_USER@$SSH_HOST:~/family-tree/docker-compose.yml
    - scp -i ~/.ssh/id_ed25519 -P $SSH_PORT deploy_tools/deploy_prod.sh $SSH_USER@$SSH_HOST:~/deploy_prod.sh
    - ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT $SSH_USER@$SSH_HOST "bash ~/deploy_prod.sh ${CI_REGISTRY} ${CI_DEPLOY_USER} ${CI_DEPLOY_PASSWORD}"
  after_script:
    - rm -rf ~/.ssh
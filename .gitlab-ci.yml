stages:
  - test
  - build-docker
  - deploy

variables:
  DOCKER_CONTEXT: "${CI_PROJECT_DIR}/app/"
  DOCKERFILE: "${CI_PROJECT_DIR}/app/Dockerfile"

# Tests, types, lint and formatting on every merge request and before every deploy of main.
test:
  stage: test
  image: node:24-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  cache:
    key:
      files: [app/package-lock.json]
    paths: [app/.npm/]
  script:
    - cd app
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run typecheck
    - npm run lint
    - npm run check-format
    - npm test -- --ci

# setup.sql and the migrations must lead to the same schema (supabase/check.sh).
# Only when something under supabase/ changed.
database:
  stage: test
  image:
    name: postgres:15-alpine
    entrypoint: [""]
  services:
    - name: postgres:15-alpine
      alias: db
  variables:
    POSTGRES_PASSWORD: check
    PGHOST: db
    PGUSER: postgres
    PGPASSWORD: check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'
      changes: [supabase/**/*]
  script:
    - sh supabase/check.sh

# Known vulnerabilities in runtime dependencies. Only warns (yellow), never blocks a deploy.
# Also runs in scheduled pipelines (Build → Pipeline schedules, e.g. weekly).
audit:
  stage: test
  image: node:24-alpine
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd app
    - npm audit --omit=dev --audit-level=critical

# Images are built with rootless BuildKit (Kaniko is no longer maintained). The same
# build runs on merge requests without pushing, so a broken Dockerfile shows up
# before the merge rather than in the deploy.
.buildkit:
  stage: build-docker
  image:
    name: moby/buildkit:v0.34.1-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox

docker_build:
  extends: .buildkit
  before_script:
    - mkdir -p ~/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > ~/.docker/config.json
  script:
    - buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="${DOCKER_CONTEXT}"
      --local dockerfile="$(dirname "${DOCKERFILE}")"
      --opt filename="$(basename "${DOCKERFILE}")"
      --output type=image,name="${CI_REGISTRY_IMAGE}/family-tree:latest",push=true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

docker_build_check:
  extends: .buildkit
  script:
    - buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="${DOCKER_CONTEXT}"
      --local dockerfile="$(dirname "${DOCKERFILE}")"
      --opt filename="$(basename "${DOCKERFILE}")"
      --output type=image,name=family-tree:check,push=false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

deploy:
  stage: deploy
  image: ubuntu:24.04
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apt-get -yq update
    - apt-get -yqq install openssh-client
    - install -m 600 -D /dev/null ~/.ssh/id_ed25519
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    # The server's host keys come from the CI variable SSH_KNOWN_HOSTS, so a forged
    # server is refused. Without it they are fetched on every run, which trusts
    # whoever answers (see README, "Deployment").
    - |
      if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        echo "WARNING: SSH_KNOWN_HOSTS is not set, trusting the host key fetched now"
        ssh-keyscan -p $SSH_PORT -H $SSH_HOST > ~/.ssh/known_hosts
      fi
  script:
    - scp -i ~/.ssh/id_ed25519 -P $SSH_PORT docker-compose.yml $SSH_USER@$SSH_HOST:~/family-tree/docker-compose.yml
    - scp -i ~/.ssh/id_ed25519 -P $SSH_PORT deploy_tools/deploy_prod.sh $SSH_USER@$SSH_HOST:~/deploy_prod.sh
    # The registry password goes through stdin: in the command line every user on the
    # server could read it in the process list
    - printf '%s\n' "$CI_DEPLOY_PASSWORD" | ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT $SSH_USER@$SSH_HOST "bash ~/deploy_prod.sh ${CI_REGISTRY} ${CI_DEPLOY_USER}"
  after_script:
    - rm -rf ~/.ssh